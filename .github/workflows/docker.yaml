# Build the image with the tested R and compilers. Push it to the GitHub Container
# Registry on branch pushes and v* tags; pull requests only build it.
name: docker-image

on:
  push:
    branches: [main, master, v3.0-alpha]
    tags: ['v*']
  pull_request:
    branches: [main, master, v3.0-alpha]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/oumarkme/tsdfgs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the two environment files agree
        run: diff <(tr -d '\r' < environment.yml) <(tr -d '\r' < env/TSDFGS.yml)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load into the runner for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/Dockerfile
          load: true
          tags: tsdfgs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm tsdfgs:test R --version | head -1
          docker run --rm tsdfgs:test Rscript -e 'library(TSDFGS); data(geno); set.seed(1); x <- optTrain(geno, cand = 1:100, n.train = 20, min.iter = 50, console = FALSE); stopifnot(length(x$OPTtrain) == 20)'

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
