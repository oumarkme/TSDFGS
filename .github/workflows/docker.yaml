# Builds the image (R, compilers, and TSDFGS from this commit), tests it, and publishes it to the
# GitHub Container Registry on main and on v* tags. Pull requests only build and test it.
#   docker pull ghcr.io/oumarkme/tsdfgs:latest
name: docker-image

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'R/**'
      - 'src/**'
      - 'data/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'environment.yml'
      - 'env/**'
      - '.dockerignore'
      - '.github/workflows/docker.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'environment.yml'
      - 'env/**'
      - '.github/workflows/docker.yaml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/oumarkme/tsdfgs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the two environment files agree
        run: diff <(tr -d '\r' < environment.yml) <(tr -d '\r' < env/TSDFGS.yml)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load into the runner for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/Dockerfile
          load: true
          tags: tsdfgs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm tsdfgs:test R --version | head -1
          docker run --rm tsdfgs:test Rscript -e 'library(TSDFGS); data(geno); set.seed(1); x <- optTrain(geno, cand = 1:100, n.train = 20, min.iter = 50, console = FALSE); stopifnot(length(x$OPTtrain) == 20, nrow(criteria()) == 18); cat("TSDFGS", as.character(packageVersion("TSDFGS")), "OK\n")'

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
