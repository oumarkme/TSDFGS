# Builds the project website (pkgdown) and publishes it to the gh-pages branch from main.
# Pull requests only build it, so a broken article is found before the merge.
name: pkgdown

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only one deployment at a time; pull request builds are independent.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::rmarkdown, any::knitr, any::ggplot2, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Check that every page has been built
        run: |
          test -s docs/index.html
          test -s docs/articles/criteria.html
          test -s docs/reference/optTrain.html
          test -s docs/news/index.html

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          branch: gh-pages
          folder: docs
