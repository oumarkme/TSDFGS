url: https://www.oumark.net/TSDFGS/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#0072B2"
    # System fonts only, so the site builds offline and loads fast.
    base_font: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    heading_font: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    code_font: "SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
    border-radius: "0.4rem"
  opengraph:
    twitter:
      creator: "@oumarkme"
      card: summary

development:
  mode: auto

navbar:
  structure:
    left: [intro, criteria, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    criteria:
      text: Criteria
      menu:
        - text: "Overview and choice"
          href: articles/criteria.html
        - text: "License review"
          href: articles/criteria-license-review.html
        - text: "Model-based"
        - text: "r-score"
          href: articles/criterion-rscore.html
        - text: "PEVmean (ridge, PCs)"
          href: articles/criterion-pev.html
        - text: "CD (ridge, PCs)"
          href: articles/criterion-cd.html
        - text: "CDmax (ridge, PCs)"
          href: articles/criterion-cdmax.html
        - text: "PEVmax"
          href: articles/criterion-pevmax.html
        - text: "MSPE of ridge regression"
          href: articles/criterion-mspe.html
        - text: "CDmean"
          href: articles/criterion-cdmean.html
        - text: "CDmean(v2)"
          href: articles/criterion-cdmean2.html
        - text: "Optimal design"
        - text: "A-optimality"
          href: articles/criterion-aopt.html
        - text: "D-optimality"
          href: articles/criterion-dopt.html
        - text: "E-optimality"
          href: articles/criterion-eopt.html
        - text: "G-optimality (GOPTPEV)"
          href: articles/criterion-gopt.html
        - text: "Genomic variation"
        - text: "GVoverall"
          href: articles/criterion-gvoverall.html
        - text: "GVaverage"
          href: articles/criterion-gvaverage.html
        - text: "Relationship"
        - text: "Avg_GRM"
          href: articles/criterion-avggrm.html
        - text: "Avg_GRM_self"
          href: articles/criterion-avggrmself.html
        - text: "Avg_GRM_MinMax"
          href: articles/criterion-avggrmminmax.html
        - text: "Clustering"
        - text: "Partitioning around medoids (PAM)"
